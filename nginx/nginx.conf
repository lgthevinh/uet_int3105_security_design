# API Gateway
#   - Routing: /api/v1/users -> user-service, /api/v1/orders -> order-service
#   - Offloading: JWT check (njs) + rate limit 10 req/s
#   - Valet key: presigned MinIO POST form (5 min) for avatar upload, via /storage/
#   - Aggregation: /api/v1/dashboard = user + their orders (njs)

load_module modules/ngx_http_js_module.so;

error_log /var/log/nginx/error.log warn;

env JWT_SECRET;

events {}

http {

    # implement rate limiting 10req/s for api limit, allocate 10MB RAM
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    js_path   /etc/nginx/njs/;
    js_import jwt from jwt.js;
    js_import dashboard from dashboard.js;

    # Timing log: gateway overhead = rt (whole request) - urt (time waiting on the upstream)
    log_format timing '$request_method $uri $status rt=$request_time urt=$upstream_response_time uct=$upstream_connect_time';
    access_log /var/log/nginx/access.log timing;

    upstream user_service  { server user-service:8080; }
    upstream order_service { server order-service:8080; }
    upstream minio_s3_api { server minio:9000; }

    server {
        # although the task not explicit told to implement burst
        # still implement as common sense.
        limit_req zone=api_limit burst=10;
        limit_req_status 429;

        # require every route jwt header by default unless "auth_request off"
        auth_request /_auth;
        # map user_id with nginx embedded vars from sub-request, so attacker cannot just pass in the header
        auth_request_set $user_id $sent_http_x_user_id; 
        proxy_set_header X-User-Id $user_id;
        # default Host is the upstream name, forward the client's Host so Tomcat in springboot does not reject
        proxy_set_header Host $host; 

        listen 80;

        # internal subrequest target that runs the njs JWT check
        location = /_auth {
            internal;
            auth_request off;
            js_content jwt.verify_jwt;
        }

        location = /health {
            auth_request off;
            return 200 "gateway ok\n";
        }

        # public login and sign up route
        location /api/v1/auth/ {
            auth_request off;
            proxy_pass http://user_service/auth/;
        }

        # not use "=" because this is prefix matching
        location /api/v1/users {
            proxy_pass http://user_service/users;
        }

        location /api/v1/orders {
            proxy_pass http://order_service/orders;
        }

        # clients POST avatars to MinIO with signed form, and read them publicly
        # no JWT here because MinIO checks the form signature instead
        location /storage/ {
            auth_request off;
            # only public reads and form uploads, so no other S3 calls are exposed
            limit_except GET HEAD POST { deny all; }
            # 2MB avatar plus multipart overhead, MinIO enforces the exact limit
            client_max_body_size 3m;
            proxy_pass http://minio_s3_api/;
        }

        # API aggregation: one call returns the caller's user + orders, fanned out in njs
        location = /api/v1/dashboard {
            js_content dashboard.getDashboard;
        }

        # Subrequest targets for the dashboard, not reachable from outside.
        # Short timeouts so one slow backend cannot hang the dashboard,
        # and a bigger buffer because njs drops subrequest bodies above it (default 4-8k).
        location /_internal/users/ {
            internal;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
            subrequest_output_buffer_size 64k;
            proxy_pass http://user_service/users/;
        }

        location = /_internal/orders {
            internal;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
            subrequest_output_buffer_size 64k;
            proxy_pass http://order_service/orders;
        }
    }
}
