# API Gateway - placeholder, not implemented yet.
# TODO:
#   - Routing: /users -> user-service, /orders -> order-service
#   - Offloading: JWT check + rate limit 10 req/s
#   - Aggregation: /dashboard = user + their orders
#   - Valet key: pre-signed MinIO URL (5 min) for avatar upload

events {}

http {

    # implement rate limiting 10req/s for api limit, allocate 10MB RAM 
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    upstream user_service  { server user-service:8080; }
    upstream order_service { server order-service:8080; }

    server {
        # although the task not explicit told to implement burst
        # still implement as common sense.
        limit_req zone=api_limit burst=10;
        limit_req_status 429;

        listen 80;

        location = /health {
            return 200 "gateway ok\n";
        }

        # not use "=" because this is prefix matching
        location /api/v1/users {
            proxy_pass http://user_service/users;
        }

        location /api/v1/orders {
            proxy_pass http://order_service/orders;
        }
    }
}
