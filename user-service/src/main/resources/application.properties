spring.application.name=user-service
server.port=8080
management.endpoints.web.exposure.include=health,info

# HS256 key, must be at least 32 bytes and identical to the gateway's JWT_SECRET.
# The fallback is for local runs only.
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes}
jwt.ttl=1h
