spring.application.name=user-service
server.port=8080
management.endpoints.web.exposure.include=health,info

# HS256 key, must be at least 32 bytes and identical to the gateway's JWT_SECRET.
# The fallback is for local runs only.
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes}
jwt.ttl=1h

# MinIO for avatar uploads. endpoint is called by this service; public-url is what clients use (via the gateway).
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.public-url=${MINIO_PUBLIC_URL:http://localhost:8080/storage}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.region=us-east-1
minio.bucket=avatars
minio.upload-ttl=5m
minio.max-avatar-size=2MB
