services:
  user-service:
    build: ./user-service
    ports:
      - "8081:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-me-dev-jwt-secret-at-least-32-bytes}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_URL: http://localhost:8080/storage
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    depends_on:
      - minio

  order-service:
    build: ./order-service
    ports:
      - "8082:8080"

  gateway:
    image: nginx:stable-alpine
    ports:
      - "8080:80"
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-me-dev-jwt-secret-at-least-32-bytes}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/njs:/etc/nginx/njs:ro
    depends_on:
      - user-service
      - order-service
      - minio

  minio:
    # opensource image of minio
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # api S3
      - "9001:9001"   # web console
    volumes:
      - minio-data:/data

volumes:
  minio-data:
