services:
  user-service:
    build: ./user-service
    ports:
      - "8081:8080"

  order-service:
    build: ./order-service
    ports:
      - "8082:8080"

  gateway:
    image: nginx:stable-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-service
      - order-service

  minio:
    # Official MinIO images are no longer published; Chainguard builds it from source
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # aoi S3
      - "9001:9001"   # web console
    volumes:
      - minio-data:/data

volumes:
  minio-data:
